name: Action pins
on:
  push:
    paths:
      - '.github/**'
      - 'tools/action-pins/**'
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * 1'
permissions:
  contents: read
concurrency:
  group: action-pins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify pinned workflow actions
        run: node .github/scripts/action-pins.mjs --check
      - name: Propose upstream updates for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/action-pins.mjs --propose
      - name: Keep review proposals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: action-pin-proposals
          path: action-pin-proposals.json
          if-no-files-found: ignore
          retention-days: 30
